repos:
  # Runs the tokenizer-based half of the brand guard, which is the half that
  # catches a regression in code: a user-visible string literal naming the
  # upstream product. stdlib-only, so no dependencies are installed into the hook
  # environment.
  #
  # It is deliberately not the whole guard. `hack/check-brand.sh` also checks the
  # legal files, the compatibility surfaces and the third-party asset counts, and
  # it is a bash script — running it here would break `git commit` on Windows,
  # where there is no bash. That half runs in `make lint`, therefore in CI.
  - repo: local
    hooks:
      - id: brand-guard
        name: brand guard (user-visible strings)
        entry: python hack/check_brand.py
        language: python
        pass_filenames: false
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
        name: check-yaml (safe)
        exclude: ^(mkdocs\.yml$|charts/.*/templates/)
      - id: check-yaml
        name: check-yaml (unsafe for mkdocs)
        files: ^mkdocs\.yml$
        args: [ --unsafe ]
      - id: debug-statements
      - id: end-of-file-fixer
        exclude: "CNAME"
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        exclude: ".*/migrations"
        args: [ --max-complexity=15 ]
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        args: [ --config, pyproject.toml ]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [ -x ]
